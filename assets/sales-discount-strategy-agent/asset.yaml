apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: sales-discount-strategy-agent
  description: AI agent that suggests optimal discount strategies for sales reps based on customer history, deal size, and competitor pricing

provides:
  apis:
    - name: sales-discount-strategy-agent
      kind: a2a
      ordId: customer.build:apiResource:sales-discount-strategy-3b73e.sales-discount-strategy-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-slspricingconditionrecord-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-discount-strategy-3b73e.sap-s4-slspricingconditionrecord-srv-mcp-server:v1
  - name: sap-s4-slspricingprocedure-srv-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-discount-strategy-3b73e.sap-s4-slspricingprocedure-srv-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
